<div class="mfa-container">
  <h2>Autenticação MFA</h2>
  <form (ngSubmit)="verificarCodigo()" #mfaForm="ngForm">
    <div class="form-group">
      <label for="codigo">Código MFA:</label>
      <input
        type="text"
        id="codigo"
        name="codigo"
        [(ngModel)]="codigoDigitado"
        required
      />
    </div>

    <!-- Se for alto risco, mostra reconhecimento facial -->
    <div *ngIf="nivel === 'alto'" class="facial-verificacao">
      <h3>Verificação Facial Obrigatória</h3>
      <app-facial (fotoCapturada)="onFotoCapturada($event)"></app-facial>
    </div>

    <button
      type="submit"
      [disabled]="mfaForm.invalid || (nivel === 'alto' && !fotoCapturada)"
    >
      Validar Código
    </button>

    <p *ngIf="errorMessage" class="error">{{ errorMessage }}</p>
  </form>
</div>
